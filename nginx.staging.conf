map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

limit_req_zone $client_ip zone=staging_contact_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=staging_newsletter_limit:10m rate=5r/m;

upstream staging_public_app {
    server staging-public-app:3000;
}

upstream staging_payload_cms {
    server staging-payload:3000;
}

server {
    listen 80;
    listen 8080;
    server_name staging-cms.datasolace.com;

    client_max_body_size 25m;

    location = / {
        return 302 https://$host/admin;
    }

    location / {
        proxy_pass http://staging_payload_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80 default_server;
    listen 8080;
    server_name staging.datasolace.com;

    client_max_body_size 12m;
    limit_req_status 429;

    error_page 429 = @json_rate_limited;

    location @json_rate_limited {
        default_type application/json;
        add_header Retry-After "900" always;
        add_header X-RateLimit-Remaining "0" always;
        return 429 '{"error":"Too many requests. Please try again later.","retryAfter":900}';
    }

    location ^~ /api/media/file/ {
        proxy_pass http://staging_payload_cms$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host staging-cms.datasolace.com;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=staging_contact_limit burst=5 nodelay;
        proxy_pass http://staging_public_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location = /api/newsletter {
        limit_except POST { deny all; }
        limit_req zone=staging_newsletter_limit burst=5 nodelay;
        proxy_pass http://staging_public_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://staging_public_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Powered-By;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
